[project]
name = "lm-worker"
version = "0.1.0"
description = "Legal Metrology compliance worker: OCR → extract → rules → report"
requires-python = "==3.12.*"
dependencies = [
  "supabase>=2.10",
  "pydantic>=2.9",
  "pyyaml>=6",
  "opencv-python>=4.10",
  "numpy>=1.26",
  "jinja2>=3.1",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# Heavy. `uv sync --extra ocr --extra pdf` in Docker / when Phase 2 and 5 land.
ocr = ["paddleocr>=2.9,<3", "paddlepaddle>=3.0"]
pdf = ["weasyprint>=62"]

[dependency-groups]
dev = [
    "pytest>=8",
 "ruff>=0.6",
 "mypy>=1.11",
 "types-PyYAML",
 "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["main.py", "pipeline", "tests"]

[[tool.mypy.overrides]]
module = ["paddleocr.*", "weasyprint.*", "docx.*"]
ignore_missing_imports = true
